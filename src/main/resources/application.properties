server.port=8088
server.servlet.context-path=/assinaturaapi


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:adminifrs}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ifrs}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sistemaestagios}

spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.datasource.init-locations=classpath*:./insert.sql
spring.sql.init.data-locations=classpath*:./insert.sql

# ==== JPA === #
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


spring.jpa.defer-datasource-initialization=true
api.security.token.secret=${JWT_SECRET:ifrsRrEeSsTtIiNnGgAa}
server.ssl.enabled=false


#Email do setor de est�gio para receber as notifica��es
sistema.emailEstagio = teste

# ========== Google Drive ==========
google.drive.root-folder-id=${GOOGLE_DRIVE_ROOT_FOLDER_ID:15KVLbIBFCyDcYvaUHeJndqX-2qh5Mwah}
google.drive.application-name=MailSender
google.drive.tokens-directory=tokens
google.drive.credentials-path=classpath:clientKey.json
google.drive.base-url=https://drive.google.com/drive/u/0/folders/
google.drive.mime-folder=application/vnd.google-apps.folder
google.drive.mime-upload=application/octet-stream

# ========== Google OAuth ==========
google.oauth.port=8888
google.oauth.user-authorization=user

# ========== JWT ==========
jwt.issuer=API ASSINATURA.EST.IFRS
jwt.expiration-hours=2
jwt.timezone=-03:00
jwt.password-recovery-minutes=10

# ========== Frontend ==========
frontend.url=${FRONTEND_URL:http://localhost:4200}

# ========== Instituicao ==========
institution.name=IFRS
institution.campus=Restinga
institution.signature-default=Equipe de estagios do IFRS RESTINGA.

# ========== Roles ==========
role.id.aluno=1
role.id.coordenador=2
role.id.setor-estagio=3
role.id.diretor=4

# ========== Status ==========
status.nova=Nova
status.aprovado=Aprovado
status.indeferido=Indeferido
status.cancelado=Cancelado
status.em-analise=Em analise
status.processando=Processando
status.finalizado=Finalizado
status.respondido=Respondido
status.relatorio=Relatorio

# ========== Cargos ==========
cargo.coordenador=Coordenador
cargo.setor-estagio=Setor de Estagio
cargo.diretor=Diretor
cargo.servidor-default=Servidor

# ========== Email Assuntos ==========
email.subject.observacao=Observacao adicionada
email.subject.notificacao-etapa=Documentacao de estagio
email.subject.documentos-assinados=Documentos Assinados!!
email.subject.solicitacao-indeferida=Solicitacao indeferida!
email.subject.relatorio-entregue=Relatorio final visto pelo coordenador!!
email.subject.estagio-cancelado=Estagio Cancelado!!
email.subject.recuperacao-senha=Recuperacao de senha
email.sender-identifier=SISTEMA

# ========== Documentos ==========
document.prefix.signed=ASSINADO_
document.prefix.final-report=RELATORIO_FINAL_

# ========== Paginacao ==========
pagination.page-size=20

# ========== CORS ==========
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=authorization,content-type,x-auth-token

