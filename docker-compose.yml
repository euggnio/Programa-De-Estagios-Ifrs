services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      network: host
    ports:
      - "8088:8088"
      # callback do OAuth instalado (LocalServerReceiver binda em 0.0.0.0:8888)
      - "8888:8888"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - GOOGLE_DRIVE_ROOT_FOLDER_ID=${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      # client OAuth lido pelo backend em runtime (default = arquivo dentro do jar)
      - GOOGLE_DRIVE_CREDENTIALS_PATH=${GOOGLE_DRIVE_CREDENTIALS_PATH:-classpath:clientKey.json}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
    volumes:
      - ./keys:/app/keys:ro
      - ./src/main/resources/clientKey.json:/app/src/main/resources/clientKey.json:ro
      - ./src/main/resources/credentials.json:/app/src/main/resources/credentials.json:ro
      - google_tokens:/app/tokens
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  google_tokens:
